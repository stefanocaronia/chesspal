name: An idea
description: Something Chesspal could do, or do better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Chesspal never uses a chess engine and never scores a position: the AI plays and judges, Chesspal keeps the rules, the board and the facts. Ideas that need an engine will not be taken.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you would like, and when it would help you while playing or learning.
    validations:
      required: true
