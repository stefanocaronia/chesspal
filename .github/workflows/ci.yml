name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Reads the code only; a newer push to the same branch stops the run it makes old.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Linux, Windows and macOS, the three systems a player installs Chesspal on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The dependencies that ship with the package, without a known vulnerability of high severity or worse.
      - run: npm audit --omit=dev --audit-level=high
        if: matrix.os == 'ubuntu-latest'
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # The package as a player installs it: packed, installed elsewhere, run through npm's shim, and its MCP server started as .mcp.json starts it.
      - run: npm run smoke
        timeout-minutes: 5

  # The oldest Node that package.json's engines allows: the package builds and runs there, which the newest 22 would not show.
  oldest-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke
        timeout-minutes: 5
